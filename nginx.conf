server {
    listen 80;
    server_name www.sidydiarra.com;
    # Redirection permanente (301) vers la version principale sans www
    return 301 https://sidydiarra.com$request_uri;
}

server {
    listen 80;
    server_name sidydiarra.com localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Support du routage Angular (évite les erreurs 404 lors d'un refresh sur une sous-page)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Mise en cache optimale des ressources statiques (images, scripts, styles)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gestion des erreurs Nginx
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}