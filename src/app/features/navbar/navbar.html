<header class="navbar">
  <!-- Top bar : Logo, Réseaux sociaux & Bouton Burger -->
  <div class="top-bar">
    <div class="logo">
      <span class="gradient-text">Sidy Diarra</span>
    </div>

    <div class="external-links">
      <!-- GitHub -->
      <a href="https://github.com/Sidy74" target="_blank" class="social-link" aria-label="GitHub">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="icon">
          <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"></path>
        </svg>
      </a>
      <!-- LinkedIn -->
      <a href="https://ml.linkedin.com/in/sidy-diarra-genie-logiciel-stage-bamako" target="_blank" class="social-link" aria-label="LinkedIn">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="icon">
          <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
          <rect x="2" y="9" width="4" height="12"></rect>
          <circle cx="4" cy="4" r="2"></circle>
        </svg>
      </a>

      <!-- Bouton Burger mobile -->
      <button class="burger-btn" (click)="toggleMenu()" aria-label="Ouvrir le menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>

  <!-- Navigation Desktop / Liens -->
  <ul class="nav-links">
    @for (item of menuItems(); track item.path) {
      <li>
        <a 
          [routerLink]="item.path" 
          routerLinkActive="active" 
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <!-- Utilisation conditionnelle de la directive Lucide selon l'icône -->
          @switch (item.icon) {
            @case ('home') {
              <svg lucideHouse class="mobile-icon" size="18" strokeWidth="2"></svg>
            }
            @case ('briefcase') {
              <svg lucideBriefcase class="mobile-icon" size="18" strokeWidth="2"></svg>
            }
            @case ('mail') {
              <svg lucideMail class="mobile-icon" size="18" strokeWidth="2"></svg>
            }
          }
          <span class="link-text">{{ item.label }}</span>
          <div class="indicator"></div>
        </a>
      </li>
    }
  </ul>

  <!-- Overlay Menu Mobile (v2) -->
  <div class="nav-overlay" [class.active]="isOpen()">
    <div class="overlay-backdrop" (click)="closeMenu()"></div>

    <nav class="overlay-menu">
      <ul class="nav-list">
        @for (item of menuItems(); track item.path; let i = $index) {
          <li class="nav-item" [style.animation-delay]="(i * 0.1) + 's'">
            <a 
              [routerLink]="item.path" 
              routerLinkActive="active-link"
              [routerLinkActiveOptions]="{ exact: true }"
              (click)="closeMenu()"
            >
              <span class="index">0{{ i + 1 }}.</span>
              <span class="label">{{ item.label }}</span>
            </a>
          </li>
        }
      </ul>
    </nav>
  </div>
</header>
