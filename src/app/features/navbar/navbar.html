<nav class="navbar">
  <div class="logo">
    <span class="gradient-text">Sidy Diarra</span>
  </div>

  <ul class="nav-links">
    @for (item of menuItems(); track item.path) {
      <li>
        <a [routerLink]="item.path" 
           routerLinkActive="active" 
           [routerLinkActiveOptions]="{exact: true}">
          {{ item.label }}
          <div class="indicator"></div>
        </a>
      </li>
    }
  </ul>

  <div class="external-links">
    <a href="https://github.com/votre-profil" target="_blank" class="social-link">Github</a>
    <a href="https://linkedin.com/in/votre-profil" target="_blank" class="social-link">LinkedIn</a>
  </div>
</nav>
