<div class="custom-slider-container">
  <div class="card-deco-dots"><span></span><span></span><span></span></div>

  <div class="slider-wrapper" [style.transform]="transformStyle()">
    <div *ngFor="let slide of slides" class="slide-item">
      <img [src]="slide.profileImg" [alt]="slide.title" class="full-card-profile-img" />

      <div class="card-bottom-overlay"></div>

      <div class="card-content">
        <div class="title-verified-row">
          <h2 class="card-title">{{ slide.title }}</h2>
          <svg viewBox="0 0 24 24" class="verified-badge" fill="currentColor">
            <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
          </svg>
        </div>
        <h3 class="card-subtitle">{{ slide.subtitle }}</h3>

        <div class="meta-tags">
          <span *ngFor="let tag of slide.tags" [ngClass]="{ 'tag-status': tag.isStatus }">
            {{ tag.text }}
          </span>
        </div>

        <p class="card-synopsis">{{ slide.synopsis }}</p>

        <ul class="slide-details">
          <li *ngFor="let detail of slide.details">
            <svg viewBox="0 0 24 24" class="check-icon" fill="none" stroke="currentColor" stroke-width="3">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            {{ detail }}
          </li>
        </ul>
      </div>

      <div class="card-actions-row">
        <app-button [label]="slide.btnText" type="outline"></app-button>
      </div>

    </div>
  </div>

  <div class="slider-pagination">
    <button
      *ngFor="let slide of slides; let i = index"
      class="bullet-dot"
      [ngClass]="{ active: currentSlide() === i }"
      (click)="goToSlide(i)"
    ></button>
  </div>
</div>
