<button
  [class]="'btn ' + type()"
  (click)="onClick()"
  [disabled]="disabled()"
  [class.is-disabled]="disabled()"
>
  <span class="btn-text">{{ label() }}</span>

  @if (iconName()) {
    @if (iconName()) {
      <svg [lucideIcon]="iconName() ?? null" class="btn-icon" size="18"></svg>
    }
  }
</button>
